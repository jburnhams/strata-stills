name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - name: PyTorch (CPU build, for the integration tests of the GPU code on the torch CPU device)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
        if: matrix.os != 'macos-latest'
      - name: PyTorch on macOS (the default wheel)
        run: pip install torch
        if: matrix.os == 'macos-latest'
      - name: Integration tests (synthetic photos built by tests/utils/photos.py; no pictures, models or network needed)
        run: pytest tests/integration -n auto --durations=10

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:integration
