<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flagged pictures</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#d8d8dc;--acc:#2a6df4}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececee;--mut:#9a9aa2;--line:#33333a;--acc:#6f9bff}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px}h1{font-size:20px;margin:0 0 4px}.mut{color:var(--mut)}
form{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}input{flex:1;min-width:220px;padding:8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
button{padding:7px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}button.l{background:transparent;color:var(--acc);border:1px solid var(--line)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.c{border:1px solid var(--line);border-radius:8px;overflow:hidden}.c.ok{opacity:.6}
.c .ph{height:220px;display:flex;align-items:center;justify-content:center;background:var(--line);cursor:pointer}.c .ph img{max-width:100%;max-height:100%;filter:blur(18px)}.c .ph.show img{filter:none}
.c .b{padding:8px 10px;font-size:13px}.p{font:12px ui-monospace,monospace;color:var(--mut);word-break:break-all}.row{display:flex;gap:6px;margin-top:6px}
</style></head><body><main>
<h1>Flagged pictures</h1><div class="mut" id="info"></div>
<form id="f"><input id="folder" placeholder="Scan a folder (and below) for more: /home/you/raw/…"><button>Scan</button></form>
<div id="msg" class="mut"></div><div id="grid"></div>
</main><script>
const $=id=>document.getElementById(id),U=p=>'../api/flagged'+p;
async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).detail||r.status);return r.json()}
const post=(u,b)=>api(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
async function load(){
  const j=await api(U(''));const n=j.items.filter(i=>!i.allowed).length;
  $('info').textContent=(j.enabled?'':'Filter is OFF. ')+j.items.length+' pictures at or above threshold '+j.threshold+'; '+n+' hidden from every output. Pictures are blurred: click one to look.';
  $('grid').replaceChildren(...j.items.map(i=>{const c=document.createElement('div');c.className='c'+(i.allowed?' ok':'');
    const ph=document.createElement('div');ph.className='ph';const im=new Image();im.loading='lazy';im.src=U('/image?path='+encodeURIComponent(i.path));ph.append(im);ph.onclick=()=>ph.classList.toggle('show');
    const b=document.createElement('div');b.className='b';b.innerHTML='<b>'+i.cls+'</b> '+i.score+(i.allowed?' &middot; cleared':'')+'<div class="p"></div><div class="row"></div>';b.querySelector('.p').textContent=i.path;
    const btn=document.createElement('button');btn.className=i.allowed?'l':'';btn.textContent=i.allowed?'Hide again':'Not nudity: allow';
    btn.onclick=async()=>{await post(U('/decide'),{path:i.path,allow:!i.allowed});load()};b.querySelector('.row').append(btn);c.append(ph,b);return c}))}
$('f').onsubmit=async e=>{e.preventDefault();$('msg').textContent='Scanning…';try{const j=await post(U('/scan'),{folder:$('folder').value});$('msg').textContent=j.kept+' pictures kept, '+j.flagged+' flagged in total'}catch(x){$('msg').textContent=String(x.message)}load()};
load().catch(e=>{$('msg').textContent=String(e.message)});
</script></body></html>
