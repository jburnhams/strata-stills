name: Database

# The photos schema (src/stratastills/db): migrations (dbtool check) and tests/unit/db on SQLite and on a throwaway PostgreSQL 18 with
# pgvector, through the shared workflow in jburnhams/database. The unit workflow does not install the database packages, so this is where
# those tests run in CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  database:
    uses: jburnhams/database/.github/workflows/app-db.yml@main
    with:
      install: uv pip install -e . --group dev
      tests: tests/unit/db
      # the reusable workflow's default `-o addopts=` drops pyproject's addopts, so strata-python's db plugin (it clashes with omarchy-db's --pg) is turned off here too, until #102
      pytest-args: "-o addopts= -p no:strata_python_db"
