<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>strata-stills</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#d8d8dc;--acc:#2a6df4}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececee;--mut:#9a9aa2;--line:#33333a;--acc:#6f9bff}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:32px 16px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:24px 0 8px}.mut{color:var(--mut)}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;cursor:pointer}.card:hover{border-color:var(--acc)}
.card b{font-size:16px}.src{font:13px ui-monospace,monospace;color:var(--mut);word-break:break-all;margin:4px 0}
form{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}input{flex:1;min-width:200px;padding:8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
button{padding:8px 14px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}button.l{background:transparent;color:var(--acc);border:1px solid var(--line);padding:2px 8px}
#err{color:#d33}
</style></head><body><main>
<h1>strata-stills</h1><div class="mut" id="dir"></div>
<h2>Projects</h2><div id="list"></div>
<form id="new"><input id="name" placeholder="New project name" required><input id="src" placeholder="First source folder (optional)"><button>Create</button></form><div id="err"></div>
<div id="detail"></div>
</main><script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function j(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||r.statusText);return d}
const post=(u,b)=>j(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const q=id=>'?id='+encodeURIComponent(id);
async function load(){const s=await j('/api/settings');$('dir').textContent='Projects folder: '+s.projects_dir;const ps=await j('/api/projects');
 $('list').innerHTML=ps.length?ps.map(p=>`<div class="card" data-id="${esc(p.id)}"><b>${esc(p.name)}</b> <span class="mut">${p.n_sources} source folder${p.n_sources==1?'':'s'}</span>${p.sources.map(x=>`<div class="src">${esc(x.path)}</div>`).join('')}</div>`).join(''):'<p class="mut">No projects yet. Create one below.</p>';
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>show(c.dataset.id))}
async function show(id){const p=await j('/api/project'+q(id)),sh=await j('/api/project/shots'+q(id));
 const n=sh.filter(s=>s.kind==='still').length;
 $('detail').innerHTML=`<h2>${esc(p.name)}</h2><p class="mut">${n} stills, ${sh.length-n} videos or unreachable folders in ${p.sources.length} source folder(s)</p>
 ${p.sources.map(x=>`<div class="src">${esc(x.path)} <button class="l" data-rm="${esc(x.path)}">remove</button></div>`).join('')}
 <form id="add"><input id="addp" placeholder="Add a source folder" required><button>Add</button></form>`;
 $('add').onsubmit=async e=>{e.preventDefault();$('err').textContent='';try{await post('/api/project/sources'+q(id),{path:$('addp').value});await load();show(id)}catch(x){$('err').textContent=x.message}};
 document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{await j('/api/project/sources'+q(id)+'&path='+encodeURIComponent(b.dataset.rm),{method:'DELETE'});await load();show(id)})}
$('new').onsubmit=async e=>{e.preventDefault();$('err').textContent='';try{const p=await post('/api/projects',{name:$('name').value,sources:$('src').value?[$('src').value]:[]});$('name').value=$('src').value='';await load();show(p.id)}catch(x){$('err').textContent=x.message}};
load();
</script></body></html>
