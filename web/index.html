<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>strata-stills</title>
    <!-- strata-react colorSchemeScript(): sets .dark before the first paint from the stored choice or the system, so a dark page does not flash light. -->
    <script>(function(){var p="system";try{var s=localStorage.getItem("strata-color-scheme");if(s==="system"||s==="light"||s==="dark")p=s}catch(e){}var d=p==="dark"||(p==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",!!d)})()</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
