[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata-stills"
version = "0.1.0"
description = "Develops and sorts still photographs (raw and JPEG) with an automatic, GPU-accelerated pipeline and a review web app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "opencv-python-headless>=4.10",
    "pillow>=10",
    "rawpy>=0.25",              # DNG / RAW decoding (LibRaw)
    "pyyaml",
    "loguru",
    "fastapi",
    "uvicorn",
    "pydantic",
    "tifffile",                 # Lightroom linear DNG and the 16 bit TIFF export
    "imagecodecs",              # JPEG XL inside those DNGs
    "nudenet",                  # the nudity filter (nsfw.py, on by default): local ONNX detector, weights inside the package
    "onnxruntime",              # runs it
    "strata-python",            # shared server code and the strata-check gate
    "strata-models-client",     # gpu.lease: hold the GPU through strata-models during batches; standard library only
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
stratastills = "stratastills.cli:main"

[dependency-groups]
# torch is NOT locked: the right build depends on the card (scripts/setup_torch.py picks CUDA, ROCm, Metal or CPU), and a locked CUDA wheel would be wrong on half the
# machines. CI installs the CPU build after `uv sync` (`uv pip install torch --index-url https://download.pytorch.org/whl/cpu`, then spandrel without its dependencies so
# that it cannot replace it: `uv pip install --no-deps spandrel==0.4.2 einops safetensors`); the tests of the GPU code run on the torch CPU device. Use `uv run --no-sync` or
# `uv sync --inexact` afterwards, a plain exact `uv sync` removes what is not locked.
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-xdist",
    "diff-cover",
    "ruff",
    "pyright",
    "ty",
    "omarchy-db",               # the photos schema (src/stratastills/db): its tests run everywhere, not skipped
    "pgvector",
    "psycopg[binary]",
]
# Detector models for the subject / object stages (same choices as strata-360).
vision = [
    "ultralytics",              # YOLO11 (fetches its own weights on first use)
    "insightface",              # faces: detection (buffalo_l)
]
# Research scripts only (scripts/lr_look.py: learning the person's own edits).
research = [
    "xgboost>=3.0",
    "scikit-learn>=1.6",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
# strata-python tracks main (no tag): uv.lock pins the commit, `uv lock --upgrade-package strata-python` moves it
strata-python = { git = "https://github.com/jburnhams/strata-python" }
omarchy-db = { git = "https://github.com/jburnhams/database", subdirectory = "python" }
strata-models-client = { git = "https://github.com/jburnhams/strata-models", subdirectory = "client" }

[tool.hatch.build.targets.wheel]
packages = ["src/stratastills"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/utils"]
testpaths = ["tests/unit"]
addopts = "-ra --timeout=300"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]       # TestClient noise from the installed starlette; remove when the dependency moves on
markers = [
    "integration: builds synthetic photos and runs the CLI / server (tests/integration)",
    "pg: needs a real Postgres with pgvector (pytest --pg); skipped on the SQLite default",
    "slow: needs downloaded models; run manually or on a schedule",
]

[tool.coverage.run]
source = ["src/stratastills"]
branch = true
omit = ["*/__main__.py", "*/stratastills/db/*"]       # db/ needs a real Postgres for most of its code: measured by the database workflow, not here

[tool.coverage.report]
skip_empty = true
show_missing = false
# Measured from the unit suite only (tests/unit). Ratchet this up as coverage improves.
# 89 -> 88 on 2026-11-09 with no test lost: `ruff format` split one-line `if x: return y` into two lines, and coverage counts lines, so the same unexecuted branches now count twice (3490 -> 5485 statements, 90.9% -> 88.8%).
fail_under = 88

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations", "web", "candidates", "models"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "TID"]
ignore = [
    "E501",    # the formatter wraps code; long comments and docstrings stay (the house style comments the why)
    "C408",    # dict(a=1) and list() calls are the house style for records
    "PT018",   # `assert a and b` is kept: one line says what holds
    "E731",    # short named lambdas
    "E741",    # one-letter names in short comprehensions
    "SIM115",  # files opened for the life of an object are closed by it
    "RUF005", "RUF046", "RUF001", "RUF002", "RUF003", "RUF043", "RUF012", "UP031", "B008",   # style-only findings, in code that is fine as written
    "B904", "B905", "RUF059", "RUF007",   # existing code: raises inside except, zips without strict, unused unpacked names; fixing them is its own change
    "S110", "S112", "S301", "S307", "S310", "S314", "S324", "S603", "S607", "SIM105",   # best-effort cleanup, hashes for caching keys, our own pickles and subprocesses (darktable, ffmpeg)
    "PT012", "PT013", "PT006",
    "B023", "B007", "F841", "C416", "C401", "SIM102", "PT011", "PT028", "B017", "E402", "E721",   # existing code, to be cleaned up one rule at a time (B023 and F841 first: they can hide bugs)
    "S311",    # random is used for jitter and sampling, never for secrets
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.importorskip".msg = "Do not skip when a dependency is missing: install it (locally and in CI) and let the test fail if it is not there. A deliberate skip is a marker with a reason, see AGENTS.md (Testing)."

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["S101"]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Ratchet: files listed here are checked strictly; the rest (typed in follow-up PRs) in basic mode. Add a file when it is fully annotated; never remove one.
strict = ["src/stratastills/__init__.py"]
# Findings in the code that is not yet in the strict list are warnings, so they are visible without blocking: dict(...) literals whose value types pyright narrows
# too far, and OpenCV/NumPy stubs. They become errors file by file as each file moves into the list.
reportArgumentType = "warning"
reportCallIssue = "warning"
reportIndexIssue = "warning"
reportOptionalOperand = "warning"
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOperatorIssue = "warning"
reportAttributeAccessIssue = "warning"
reportMissingImports = "warning"      # GPU libraries (torch, ultralytics, insightface...) are only installed where the card is
reportMissingTypeStubs = "warning"
reportPossiblyUnbound = "warning"
reportReturnType = "warning"
reportAssignmentType = "warning"
reportGeneralTypeIssues = "warning"

[tool.ty.rules]
# ty exits 1 on warnings too, so the rules below are off, not warnings. pyright (above) reports the same code as visible warnings and is the ratchet; turn a rule back on
# here once pyright's matching warning is gone.
call-non-callable = "ignore"
import-not-found = "ignore"
invalid-assignment = "ignore"
invalid-argument-type = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
missing-attribute = "ignore"
unresolved-global = "ignore"
unsupported-operator = "ignore"
missing-union-attribute = "ignore"

[tool.omarchy-db]
app = "photos"                                     # schema `photos` in the shared `omarchy` Postgres (jburnhams/database); the app runs on Postgres only, the unit tests run on SQLite
models = "stratastills.db.models:Base"
migrations = "migrations"
